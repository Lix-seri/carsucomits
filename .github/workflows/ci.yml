name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carsucomits_test
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/carsucomits_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/carsucomits_test
      AUTH_SECRET: ci-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Conventional Commits (pushed commits)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          for sha in $(git rev-list "${{ github.event.before }}..${{ github.sha }}"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            sh .githooks/commit-msg /tmp/msg
          done

      - name: Types, lint, structure
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: End-to-end tests (desktop + mobile)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
